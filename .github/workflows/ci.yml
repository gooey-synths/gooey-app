name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Electron Main Process Tests
        run: npm run test:electron

      - name: Run Unit Tests
        run: npm run test:ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run E2E Tests with Playwright
        run: npm run test:e2e

      # Electron needs a display. It works headless on a dev box with a GPU or
      # a running X server, but not on a bare CI runner.
      - name: Run Electron E2E Tests
        run: xvfb-run --auto-servernum npm run test:e2e:electron