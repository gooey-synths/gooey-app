<div class="bg-gray-100 border border-gray-300 rounded-md shadow-sm p-3 text-sm text-gray-800">
  <div fDragHandle class="font-semibold text-gray-700 mb-2 border-b border-gray-300 pb-1 cursor-move select-none">
    VCA
  </div>

  <div class="mt-3 flex flex-col items-end">
    <div class="flex items-center gap-1 text-xs text-gray-600">
      <span>Audio Input</span>
        <div class="w-3 h-3 rounded-full bg-gray-700" fNodeInput [fInputId]="node.config.inputs.audio" fOutputConnectableSide="left" [fInputMultiple]="false"></div>
    </div>

    <div class="flex items-center gap-1 text-xs text-gray-600">
      <span>CV Input</span>
        <div class="w-3 h-3 rounded-full bg-gray-700" fNodeInput [fInputId]="node.config.inputs.cv" fOutputConnectableSide="left" [fInputMultiple]="false"></div>
    </div>
  </div>
</div>
