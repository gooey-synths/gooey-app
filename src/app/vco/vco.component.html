<div class="bg-gray-100 border border-gray-300 rounded-md shadow-sm p-3 text-sm text-gray-800 w-56">

  <!-- Header / Drag Handle -->
  <div
    fDragHandle
    class="font-semibold text-gray-700 mb-2 border-b border-gray-300 pb-1 cursor-move select-none"
  >
    VCO
  </div>

  <!-- Waveform selector -->
  <div class="mb-3">
    <label for="wave-select" class="block text-xs font-medium text-gray-600 mb-1">
      Wave
    </label>
    <select
      [ngModel]="node.config['waveform']"
      (ngModelChange)="update('waveform', $event)"
      class="w-full bg-white border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500"
      id="wave-select"
    >
      <option value="sine">Sine</option>
      <option value="square">Square</option>
      <option value="saw">Saw</option>
    </select>
  </div>

  <!-- Knobs / Sliders -->
  <div class="flex gap-3 mb-3">
    <!-- Frequency -->
    <div class="flex-1">
      <label for="freq-range" class="block text-xs font-medium text-gray-600 mb-1">
        Freq
      </label>
      <input
        type="range"
        min="20"
        max="2000"
        [ngModel]="node.config['frequency']"
        (ngModelChange)="update('frequency', $event)"
        class="w-full accent-blue-500"
        id="freq-range"
      />
      <div class="text-xs text-gray-700 tabular-nums mt-1">
        {{ node.config['frequency'] }} Hz
      </div>
    </div>

    <!-- Pulse Width -->
    <div class="flex-1">
      <label for="pw-range" class="block text-xs font-medium text-gray-600 mb-1">
        PW
      </label>
      <input
        type="range"
        min="0.05"
        max="0.95"
        step="0.01"
        [ngModel]="node.config['pw']"
        (ngModelChange)="update('pw', $event)"
        class="w-full accent-blue-500"
        id="pw-range"
      />
      <div class="text-xs text-gray-700 tabular-nums mt-1">
        {{ node.config['pw'] }}
      </div>
    </div>
  </div>

  <div class="pt-2 border-t border-gray-300 flex flex-col">

    <div class="flex flex-col justify-center mb-3 border-b pb-3 border-gray-300">
      <div class="text-xs font-semibold text-gray-700 mb-3" >Inputs</div>
      <div class="flex items-center justify-between gap-1 text-xs text-gray-600">
        <div
          class="w-3 h-3 rounded-full bg-gray-700"
        ></div>
        <span>V/Oct</span>
      </div>

      <div class="flex items-center justify-between gap-1 text-xs text-gray-600">
        <div
          class="w-3 h-3 rounded-full bg-gray-700"
        ></div>
        <span>PWM</span>
      </div>
    </div>

    <div class="flex flex-col justify-center mb-3">
      <div class="text-xs font-semibold text-gray-700 mb-3">Outputs</div>

      <div class="flex items-center justify-between gap-1 text-xs text-gray-600">

        <span>OUT</span>
        <div>
          <div fNodeOutlet class="w-3 h-3 rounded-full bg-gray-700"></div>
          <div
            fNodeOutput
            [fOutputId]="node.config.outputs!['out']"
            fOutputConnectableSide="right"
            [fOutputMultiple]="true"
          ></div>
        </div>
      </div>
    </div>
  </div>
</div>
