<div class="bg-gray-100 border border-gray-300 rounded-md shadow-sm p-3 text-sm text-gray-800">
  <!-- Title -->
  <div fDragHandle class="font-semibold text-gray-700 mb-2 border-b border-gray-300 pb-1 cursor-move select-none">
    Envelope (ADSR)
  </div>

  <!-- Attack -->
  <div class="flex items-center justify-between mb-1">
    <label for="attack-range" class="text-xs font-medium text-gray-600">Attack (s)</label>
    <span class="text-xs tabular-nums">{{ node.config.attack }}</span>
  </div>
  <input
    type="range"
    min="0.001"
    max="2"
    step="0.001"
    class="w-full mb-2 accent-blue-500"
    [ngModel]="node.config.attack"
    (ngModelChange)="update('attack', $event)"
    id="attack-range"
  />

  <!-- Decay -->
  <div class="flex items-center justify-between mb-1">
    <label for="decay-range" class="text-xs font-medium text-gray-600">Decay (s)</label>
    <span class="text-xs tabular-nums">{{ node.config.decay }}</span>
  </div>
  <input
    id="decay-range"
    type="range"
    min="0.001"
    max="2"
    step="0.001"
    class="w-full mb-2 accent-blue-500"
    [ngModel]="node.config.decay"
    (ngModelChange)="update('decay', $event)"
  />

  <!-- Sustain -->
  <div class="flex items-center justify-between mb-1">
    <label for="sustain-range" class="text-xs font-medium text-gray-600">Sustain</label>
    <span class="text-xs tabular-nums">{{ node.config.sustain }}</span>
  </div>
  <input
    id="sustain-range"
    type="range"
    min="0"
    max="1"
    step="0.01"
    class="w-full mb-2 accent-blue-500"
    [ngModel]="node.config.sustain"
    (ngModelChange)="update('sustain', $event)"
  />

  <!-- Release -->
  <div class="flex items-center justify-between mb-1">
    <label for="id-range" class="text-xs font-medium text-gray-600">Release (s)</label>
    <span class="text-xs tabular-nums">{{ node.config.release }}</span>
  </div>
  <input
    id="id-range"
    type="range"
    min="0.001"
    max="5"
    step="0.001"
    class="w-full accent-blue-500"
    [ngModel]="node.config.release"
    (ngModelChange)="update('release', $event)"
  />

  <!-- Outputs -->
  <div class="mt-3 pt-2 border-t border-gray-300 flex justify-end">
    <div class="flex items-center gap-1 text-xs text-gray-600">
      <span>OUT</span>
      <div fNodeOutlet class="w-3 h-3 rounded-full bg-gray-700"></div>
      <div
        fNodeOutput
        [fOutputId]="node.config.outputs.out"
        fOutputConnectableSide="right"
        [fOutputMultiple]="true"
      ></div>
    </div>
  </div>
</div>
