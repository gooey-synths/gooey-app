<div class="flex flex-col h-screen">
  <!-- Toolbar -->
  <header class="bg-gray-800 text-white p-4 flex items-center justify-between">
    <h1 class="text-lg font-bold">Gooey App</h1>
    <div class="flex justify-between items-center">
      @if (lastError$ | async; as lastError) {
        <span class="text-red-400 text-sm mx-2" data-testid="device-error">{{ lastError }}</span>
      }
      <span
        data-testid="connection-dot"
        class="inline-block w-3 h-3 rounded-full"
        [class.bg-green-500]="(deviceStatus$ | async) === 'connected'"
        [class.bg-gray-500]="(deviceStatus$ | async) !== 'connected'"
        [title]="'Device: ' + (deviceStatus$ | async)"
      ></span>
      @if ((deviceStatus$ | async) !== 'connected') {
        <button
          (click)="onConnect()"
          class="bg-blue-500 hover:bg-blue-600 px-4 py-2 mx-2 rounded"
        >
          Connect
        </button>
      } @else {
        <button
          (click)="onDisconnect()"
          class="bg-gray-600 hover:bg-gray-500 px-4 py-2 mx-2 rounded"
        >
          Disconnect
        </button>
      }
      <button
        (click)="onSendToHardware()"
        [disabled]="(deviceStatus$ | async) !== 'connected' || (sendStatus$ | async) === 'sending'"
        class="bg-blue-500 hover:bg-blue-600 px-4 py-2 mx-2 rounded disabled:opacity-50"
      >
        {{ (sendStatus$ | async) === 'sending' ? 'Sending…' : 'Send to Hardware' }}
      </button>
      <button (click)="onSave()" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 mx-2 rounded">
        Save
      </button>
      <button class="bg-blue-500 hover:bg-blue-600 px-4 py-2 mx-2 rounded">
        Load
      </button>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <aside class="bg-gray-100 w-64 p-4 overflow-y-auto border-r border-gray-300">
      <app-node-selector></app-node-selector>
    </aside>

    <main class="flex-1 bg-white relative overflow-hidden">
      <router-outlet></router-outlet>
      <app-main-canvas></app-main-canvas>
    </main>
  </div>
</div>
